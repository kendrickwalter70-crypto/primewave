/* Layout: navy header band with the wave logo, one centered column below. Home = tracking box, results, help. Hidden owner area = shipments list, shipment form and settings. */
:root {

    --warn: #f0b84a; --warn-soft: #3a2d10; --bad: #ff8a80; --bad-soft: #3b1815; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #09131f; --surface: #112033; --fg: #e6eef7; --muted: #92a4b8; --line: #24384e;
  --brand: #06182b; --accent: #38bddf; --accent-fg: #04202b; --accent-soft: #0f3342;
  --warn: #f0b84a; --warn-soft: #3a2d10; --bad: #ff8a80; --bad-soft: #3b1815; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.5; padding: 0; }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top { background: var(--brand); color: var(--brand-fg); }
.top .in { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 14px; flex-wrap: wrap; }
.logo { display: flex; align-items: center; gap: 11px; background: none; border: 0; color: inherit; padding: 0; cursor: pointer; text-align: left; }
.logo svg { width: 40px; height: 40px; flex: none; }
.logo .nm { display: flex; flex-direction: column; line-height: 1; }
.logo b { font-family: var(--font-display); font-size: 21px; font-weight: 700; letter-spacing: -.01em; }
.logo small { font-size: 10px; letter-spacing: .32em; margin-top: 4px; opacity: .75; font-weight: 600; }
.nav { display: flex; gap: 6px; }

.nav button:hover { background: rgba(255,255,255,.1); opacity: 1; }
.main { max-width: 760px; margin: 0 auto; padding-block: 26px 40px; display: flex; flex-direction: column; gap: 20px; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(30px, 8vw, 42px); line-height: 1.05; margin: 0 0 8px; text-wrap: balance; letter-spacing: -.01em; }
h2 { font-family: var(--font-display); font-size: 22px; margin: 0; }
h3 { font-family: var(--font-display); font-size: 16px; margin: 0 0 12px; }
.lead { color: var(--muted); margin: 0; max-width: 52ch; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.grid .full { grid-column: 1 / -1; }

label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; min-width: 0; }
input, select, textarea { font: inherit; font-weight: 400; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px 13px; min-width: 0; width: 100%; }
textarea { min-height: 90px; resize: vertical; }
input:focus-visible, button:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.btn { font: inherit; font-weight: 600; background: var(--accent); color: var(--accent-fg); border: 0; border-radius: 10px; padding: 12px 18px; cursor: pointer; }
.btn:hover { filter: brightness(1.07); }

.btn.danger { background: var(--bad-soft); color: var(--bad); }
.btn.small { padding: 7px 12px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: default; }
.bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.bar .grow { flex: 1; }
.link { font: inherit; font-size: 13px; background: none; border: 0; padding: 0; color: var(--muted); text-decoration: underline; cursor: pointer; }
.hint { font-size: 13px; color: var(--muted); margin: 0; }
.err { background: var(--bad-soft); color: var(--bad); border-radius: 10px; padding: 12px 14px; font-weight: 500; }
.ok { background: var(--accent-soft); color: var(--accent); border-radius: 10px; padding: 12px 14px; font-weight: 500; }
.warnbox { background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 12px 14px; font-weight: 500; }
.head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.tn { font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.meaning { margin: 14px 0 0; padding: 12px 14px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); font-size: 14px; }

.steps li:first-child::before { display: none; }
.steps li.done::before, .steps li.now::before { background: var(--accent); }
.dot { width: 24px; height: 24px; border-radius: 50%; background: var(--surface); border: 3px solid var(--line); position: relative; z-index: 1; }
.done .dot { background: var(--accent); border-color: var(--accent); }
.now .dot { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.now, .done { color: var(--fg); }
.now { font-weight: 600; }
.tl { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 14px; }
.tl li { display: grid; grid-template-columns: 112px 1fr; gap: 12px; font-size: 14px; }
.tl time { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.tl .where { color: var(--muted); font-size: 13px; }
@media (max-width: 420px) { .tl li { grid-template-columns: 1fr; gap: 2px; } }
.evs { display: flex; flex-direction: column; gap: 12px; }
.ev { border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.ev .full { grid-column: 1 / -1; }
.ev .row { display: flex; justify-content: flex-end; }
@media (max-width: 480px) { .ev { grid-template-columns: 1fr; } }
.meta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; font-size: 14px; margin: 18px 0 0; }
@media (max-width: 520px) { .meta { grid-template-columns: 1fr 1fr; } }
.meta dt { color: var(--muted); font-size: 12px; }
.meta dd { margin: 2px 0 0; font-weight: 500; overflow-wrap: anywhere; }
.olist { list-style: none; margin: 0; padding: 0; }
.olist li { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 0; border-top: 1px solid var(--line); }
.olist li:first-child { border-top: 0; padding-top: 0; }
.olist .who { flex: 1; min-width: 150px; }
.olist .who b { font-weight: 600; }
.olist .who span { display: block; color: var(--muted); font-size: 13px; }
.foot { color: var(--muted); font-size: 13px; }
.foot button { font: inherit; color: inherit; background: none; border: 0; padding: 6px 4px; cursor: default; }
.lab { font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; margin: 18px 0 4px; }
.lab.first { margin-top: 0; }
.bigv { font-family: var(--font-display); font-size: clamp(28px, 8vw, 36px); line-height: 1.1; }
.statv { font-size: 20px; font-weight: 500; }
.statv.warn { color: var(--warn); } .statv.bad { color: var(--bad); }
.vs { list-style: none; margin: 26px 0 0; padding: 0; }
.vs li { display: flex; align-items: stretch; gap: 16px; min-height: 64px; }
.vs .rail { width: 44px; flex: none; position: relative; display: flex; align-items: center; justify-content: center; }
.vs .rail::before { content: ""; position: absolute; left: 50%; margin-left: -4px; width: 8px; top: 0; bottom: 0; background: var(--line); }
.vs li:first-child .rail::before { top: 50%; border-radius: 8px 8px 0 0; }
.vs li:last-child .rail::before { bottom: 50%; border-radius: 0 0 8px 8px; }
.vs .done .rail::before { background: var(--accent); }
.vs .now .rail::before { background: linear-gradient(var(--accent) 50%, var(--line) 50%); }
.vs .dot { position: relative; width: 10px; height: 10px; border-radius: 50%; background: #fff; }
.vs .todo .dot { background: var(--muted); opacity: .6; }
.vs .big { position: relative; width: 44px; height: 44px; border-radius: 50%; background: var(--accent); color: var(--accent-fg); display: flex; align-items: center; justify-content: center; }
.vs .now { background: var(--bg); border-radius: 44px 22px 22px 44px; }
.vs .txt { display: flex; flex-direction: column; justify-content: center; gap: 2px; padding: 10px 12px 10px 0; min-width: 0; }
.vs .t { font-weight: 700; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; }
.vs .todo .t { color: var(--muted); }
.vs .s { font-size: 14px; color: var(--muted); overflow-wrap: anywhere; }
.vs .s.i { font-style: italic; font-size: 13px; }
.srow { display: flex; gap: 8px; align-items: center; }
.srow input { flex: 1; }
.olist select.qs { width: auto; border: 0; padding: 6px 10px; font-size: 12px; font-weight: 600; cursor: pointer; }
.srow .btn { flex: none; }
@media (prefers-reduced-motion: no-preference) { .rise { animation: rise .3s ease-out both; } @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } } }

    if (!b) return;
    var a = b.getAttribute("data-act"), i = Number(b.getAttribute("data-i"));
    if (a === "home") { notice = null; editing = null; view = "home"; render(); window.scrollTo(0, 0); return; }
    if (a === "help") { if (view !== "home") { view = "home"; render(); } goto(a); return; }
    if (a === "staff") { notice = null; view = ORDERS ? "manage" : "gate"; render(); window.scrollTo(0, 0); return; }
    if (a === "lock") { PASS = null; ORDERS = null; store("trk_pass", null); store("trk_mgr", null); notice = null; view = "home"; render(); return; }
    if (a === "new") { notice = null; editing = blank(); render(); window.scrollTo(0, 0); return; }
    if (a === "edit") {
      var o = ORDERS[i]; notice = null;
      editing = { isNew: false, id: o.id, recipient: o.recipient, origin: o.origin, destination: o.destination, service: o.service, weight: o.weight, contents: o.contents, status: String(o.status), meaning: o.meaning || defMean(o.status), eta: o.eta, signedBy: o.signedBy, added: 0,
        events: o.events.map(function (v) { return { dl: toLocalInput(v.when), text: v.text, where: v.where || "" }; }) };
      render(); window.scrollTo(0, 0); return;
    }
    if (a === "addev") { readForm(); editing.events.unshift({ dl: toLocalInput(new Date().toISOString()), text: "", where: "" }); editing.added = (editing.added || 0) + 1; render(); return; }
    if (a === "rmev") { readForm(); editing.events.splice(i, 1); render(); return; }
    if (a === "cancel") { notice = null; editing = null; render(); return; }
    if (a === "settings") {
      notice = null; editing = "settings";
      draft = { phone: S.settings.phone || "", email: S.settings.email || "", steps: STEPS.map(function (s) { return { id: s.id, name: s.name }; }), special: { onhold: SPECIAL.onhold, exception: SPECIAL.exception, returned: SPECIAL.returned } };
      render(); window.scrollTo(0, 0); return;
    }
    if (a === "up" || a === "down") {
      readSettings(); var j = a === "up" ? i - 1 : i + 1;
      if (j >= 0 && j < draft.steps.length) { var tmp = draft.steps[i]; draft.steps[i] = draft.steps[j]; draft.steps[j] = tmp; }
      render(); return;
    }
    if (a === "rmstep") { readSettings(); if (draft.steps.length > 2) draft.steps.splice(i, 1); render(); return; }
    if (a === "addstep") { readSettings(); draft.steps.splice(draft.steps.length - 1, 0, { id: "n" + Date.now().toString(36) + Math.floor(Math.random() * 1000), name: "New step" }); render(); return; }
    if (a === "chpass") { changePass(); return; }
    if (a === "samples") { addSamples(); persist(); render(); return; }
    if (a === "publish") { publishAll(); return; }
    if (a === "delete") {
      readForm();
      if (!editing.confirmDelete) { editing.confirmDelete = true; render(); return; }
      ORDERS = ORDERS.filter(function (o) { return o.id !== editing.id; });
      dirty = true; editing = null; persist();
      notice = { kind: "ok", text: "Shipment deleted. Press Publish to customers to remove it from the customer page." };
      render();
    }
  });
  root.addEventListener("submit", function (ev) {
    ev.preventDefault();
    var f = ev.target.getAttribute("data-form");
    if (f === "lookup") doLookup();
    else if (f === "gate") doGate();
    else if (f === "order") saveOrder();
    else if (f === "settings") saveSettings();
  });

  /* ---------- start ---------- */
  render();
  loadPublic().then(function () {
    var t = document.getElementById("tid");
    if (view === "home" && t && !t.value && !lookupResult) render();
  });
  var sp = load("trk_pass");
  if (sp && load("trk_mgr") === "1") {
    api("login", { password: sp }).then(function (r) {
      if (!r.ok) { if (r.status === 401) { store("trk_pass", null); store("trk_mgr", null); } return; }
      ORDERS = r.data.orders || []; PASS = sp; dirty = !!r.data.dirty;
      if (r.data.settings) { S.settings = r.data.settings; applyLabels(); }
      view = "manage"; render();
    });
  }
})();
</script></body></html>
